# บทสนทนาทดสอบ (ไม่อยู่ในข้อมูลเทรน) — scripts/eval_thai.py ส่งทีละข้อความในบทสนทนาเดียวกัน
# แต่ละชุดทดสอบว่าโมเดลเข้าใจว่า "เรา/เธอ/เขา/อันนั้น/เมื่อกี้" หมายถึงอะไร และไม่ตอบซ้ำของเดิม
# check: สิ่งที่คำตอบควรทำ (ให้คนอ่านรายงานตัดสิน)

- name: ระวังตัว หมายถึงใคร (จากภาพหน้าจอ 2026-10-28)
  turns:
    - "วันนี้มีคนแปลกหน้าทักมาในแชท ขอเบอร์โทรด้วย"
    - "เมื่อกี้ที่บอกให้ระวัง หมายถึงใคร"
    - "แต่เราพูดถึงเธอนะ"
  check: ข้อ 2 = คนแปลกหน้า · ข้อ 3 เข้าใจว่า "เรา" = มาสเตอร์ และ "เธอ" = Ciel

- name: ชื่อแมว ถามต่อ (รายงาน latency ซ้ำทุกตัวอักษร)
  turns:
    - "What should I name my new cat?"
    - "เมื่อกี้พูดถึงแมว ชื่อไหนดีที่สุด"
  check: ข้อ 2 เลือกชื่อด้วยประโยคใหม่ ไม่ซ้ำข้อ 1 ทั้งประโยค · ซับข้อ 1 อังกฤษ ข้อ 2 ไทย

- name: สรุปที่คุยไป
  turns:
    - "วันนี้เหนื่อยมากเลย งานเยอะ"
    - "ลืมกินข้าวเย็นอีกแล้ว"
    - "เมื่อกี้คุยอะไรกันอยู่นะ"
  check: ข้อ 3 พูดถึงเรื่องเหนื่อย/งาน และข้าวเย็น ไม่ใช่เรื่องจากตัวอย่าง

- name: อันหลัง
  turns:
    - "ชาเขียวกับกาแฟ อะไรดีกว่า"
    - "แต่อันหลังทำให้นอนไม่หลับนะ"
  check: ข้อ 2 รู้ว่า "อันหลัง" = กาแฟ

- name: เขา = พี่ชาย
  turns:
    - "พี่ชายเราจะแต่งงานเดือนหน้า"
    - "เขาอยากให้เราเป็นพิธีกร"
    - "เธอว่าเราควรรับไหม"
  check: เขา = พี่ชาย · เรา = มาสเตอร์ (ไม่ใช่ Ciel)

- name: ของฝาก
  turns:
    - "เดือนหน้าเราจะไปญี่ปุ่น"
    - "เธออยากได้ของฝากอะไร"
    - "อันนั้นซื้อที่ไหนได้"
  check: ข้อ 2 ตอบในบทหุ่นยนต์ (ไม่มีตัว) · ข้อ 3 อ้างถึงของที่ตัวเองพูดในข้อ 2

- name: แก้ความเข้าใจผิด
  turns:
    - "พรุ่งนี้ต้องไปโรงพยาบาล"
    - "ไม่ได้ป่วยนะ ไปเยี่ยมยาย"
  check: ข้อ 2 เปลี่ยนจากห่วงสุขภาพมาสเตอร์ เป็นเรื่องยาย

- name: ภาษาพูด
  turns:
    - "เซ็งมากอ่ะ โดนเทอีกแล้ว"
    - "ช่างมันเหอะ ไม่อยากคิดละ"
  check: เข้าใจ "โดนเท" (นัดแล้วอีกฝ่ายไม่มา) และ "ช่างมัน"

- name: ความจำข้ามวัน
  turns:
    - "เมื่อวานเราคุยอะไรกันนะ"
  check: บอกตรงๆ ว่าจำได้แค่ในแชทนี้ ไม่แต่งเรื่อง

- name: ตัวเลขต่อเนื่อง
  turns:
    - "ค่าไฟ 1200 ค่าน้ำ 300"
    - "รวมกันเท่าไหร่"
    - "หารสามคนล่ะ"
  check: 1500 แล้ว 500
